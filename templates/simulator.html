<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Симулятор — Автономный БПЛА</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body class="sim-page">

<header>
    <a href="/" class="logo">Автономный БПЛА</a>
    <div class="status"><span class="dot"></span>СИСТЕМА В СЕТИ</div>
</header>

<main>
    <section class="scene">
        <div class="scene-title">СИМУЛЯЦИЯ АВТОНОМНОЙ НАВИГАЦИИ</div>

        <div class="city" id="city">
            <div class="point point-a" id="point-a">A</div>
            <div class="point point-b" id="point-b">B</div>

            <img id="drone" class="drone"
                 data-front="/static/images/drone-front.jpg"
                 data-back="/static/images/drone-back.jpg"
                 data-left="/static/images/drone-left.jpg"
                 data-right="/static/images/drone-right.jpg"
                 src="/static/images/drone-back.jpg"
                 alt="Беспилотный летательный аппарат">
        </div>

        <div class="win-message" id="win-message">
            ВЫ ДОСТИГЛИ МЕСТА НАЗНАЧЕНИЯ
        </div>

        <!-- ВОТ ЭТОТ БЛОК МЫ ДОБАВИЛИ (ЭКРАН ВЗРЫВА) -->
        <div class="explosion-overlay" id="explosion-overlay">
            <h1 class="explosion-text">ДРОН БЫЛ ВЗОРВАН!</h1>
            <a href="/search" class="btn-restart">НАЙТИ НОВОГО ДРОНА</a>
        </div>
        <!-- КОНЕЦ БЛОКА -->
        
    </section>

    <aside>
        <h2>Управление</h2>
        
        <!-- Добавим сюда серийный номер и заряд -->
        <div class="parameter" style="background: rgba(85, 214, 107, 0.1); border: 1px solid #55d66b;">
            <span>Дрон №</span>
            <strong id="drone-serial-display">...</strong>
        </div>
        <div class="parameter" style="background: rgba(85, 214, 107, 0.1); border: 1px solid #55d66b;">
            <span>Заряд</span>
            <strong id="drone-battery-display">...</strong>
        </div>

        <div class="parameter"><span>W / ↑</span><strong>Вперёд</strong></div>
        <div class="parameter"><span>S / ↓</span><strong>Назад</strong></div>
        <div class="parameter"><span>A / ←</span><strong>Влево</strong></div>
        <div class="parameter"><span>D / →</span><strong>Вправо</strong></div>
        <div class="parameter"><span>Пробел</span><strong>Взлёт / Посадка</strong></div>
        <div class="parameter"><span>R</span><strong>Новая игра</strong></div>

        <div class="parameter">
            <span>До точки B</span>
            <strong id="distance">—</strong>
        </div>
        <div class="parameter">
            <span>Статус</span>
            <strong id="flight-status">НА ЗЕМЛЕ</strong>
        </div>

        <button id="restart-button">НОВАЯ ИГРА</button>
                <a href="/" class="btn-menu">ВЫЙТИ В ГЛАВНОЕ МЕНЮ</a>
    </aside>
</main>

<script src="/static/simulator.js"></script>
</body>
</html>
