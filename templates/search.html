<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Поиск дрона</title>
    <link rel="stylesheet" href="/static/style.css">
    <style>
        /* Стили для страницы поиска */
        .search-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            background: #111315;
            color: #eee;
        }
        .spinner {
            width: 60px;
            height: 60px;
            border: 4px solid rgba(85, 214, 107, 0.2);
            border-top-color: #55d66b;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 20px;
        }
        @keyframes spin { 100% { transform: rotate(360deg); } }
        
        .result-card {
            background: #181a1d;
            border: 1px solid #303030;
            padding: 40px;
            border-radius: 16px;
            text-align: center;
            display: none; /* Скрыто по умолчанию */
        }
        .result-card img {
            width: 200px;
            height: 200px;
            object-fit: contain;
            margin-bottom: 20px;
        }
        .result-card h2 { margin: 10px 0; color: #55d66b; }
        .result-card p { font-size: 18px; color: #aaa; }
        .result-card strong { color: #fff; font-size: 22px; }
        
        .buttons {
            margin-top: 30px;
            display: flex;
            gap: 15px;
        }
        .btn-search {
            background: #25282c;
            border: 1px solid #555;
            color: white;
            padding: 15px 30px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
        }
        .btn-start {
            background: #d87528;
            border: none;
            color: white;
            padding: 15px 30px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
        }
        .btn:hover { filter: brightness(1.2); }
    </style>
</head>
<body>

<div class="search-container">
    <!-- ЭКРАН ЗАГРУЗКИ -->
    <div id="loading-screen">
        <div class="spinner"></div>
        <h2>Поиск заряженного дрона...</h2>
    </div>

    <!-- РЕЗУЛЬТАТ ПОИСКА -->
    <div class="result-card" id="result-card">
        <img src="/static/images/drone-front.jpg" alt="Дрон">
        <h2>Дрон найден</h2>
        <p>Серийный номер: <strong id="drone-serial">0</strong></p>
        <p>Заряд: <strong id="drone-battery">0</strong>%</p>
        
        <div class="buttons">
            <button class="btn-search" onclick="startSearch()">Найти другого</button>
            <button class="btn-start" id="btn-control">Управлять</button>
        </div>
    </div>
</div>

<script>
    const loadingScreen = document.getElementById('loading-screen');
    const resultCard = document.getElementById('result-card');
    const serialEl = document.getElementById('drone-serial');
    const batteryEl = document.getElementById('drone-battery');
    const btnControl = document.getElementById('btn-control');

    function startSearch() {
        // Показываем загрузку, скрываем результат
        loadingScreen.style.display = 'block';
        resultCard.style.display = 'none';

        // Ждем 5 секунд (5000 мс)
        setTimeout(() => {
            // Генерируем серийный номер (начинается на 1, всего 5 цифр)
            const serial = Math.floor(10000 + Math.random() * 90000);
            
            // Генерируем заряд от 40 до 80
            const battery = Math.floor(Math.random() * 41) + 40;

            // Вставляем данные на экран
            serialEl.textContent = serial;
            batteryEl.textContent = battery;

            // При нажатии "Управлять" переходим в симулятор и передаем данные в ссылке
            btnControl.onclick = () => {
                window.location.href = `/simulator?serial=${serial}&battery=${battery}`;
            };

            // Меняем экраны
            loadingScreen.style.display = 'none';
            resultCard.style.display = 'block';
        }, 5000);
    }

    // Запускаем поиск при загрузке страницы
    startSearch();
</script>
</body>
</html>
