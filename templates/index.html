<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Автономный БПЛА</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body class="hero-page">

    <!-- МОДАЛЬНОЕ ОКНО ВЫБОРА УСТРОЙСТВА -->
    <div id="device-modal" class="device-modal" style="display: none;">
        <div class="modal-content">
            <h2>Выберите устройство</h2>
            <p>От этого зависит управление и вид игры.</p>
            <div class="device-buttons">
                <button onclick="selectDevice('pc')">💻 Компьютер</button>
                <button onclick="selectDevice('mobile')">📱 Телефон</button>
            </div>
        </div>
    </div>

    <!-- Кнопки аккаунта -->
    <div class="auth-buttons">
        {% if not session.username %}
            <a href="/login" class="btn-login">Войти</a>
            <a href="/register" class="btn-register">Регистрация</a>
        {% endif %}
    </div>

    <div class="hero-wrapper">
        <img class="hero-image" src="/static/images/hero.jpg" alt="Автономный БПЛА">

        <a href="/device" class="hero-btn hero-btn-1"></a>
        <a href="/tutorial" class="hero-btn hero-btn-2"></a>
        <a href="/search" class="hero-btn hero-btn-3"></a>
    </div>

    <!-- Юзернейм и выход внизу -->
    {% if session.username %}
    <div class="bottom-user-panel">
        <span class="bottom-username">
            👤 Вы вошли как: <strong style="color: #55d66b;">{{ session.username }}</strong>
        </span>
        <a href="/logout" class="btn-logout-bottom">Выйти</a>
    </div>
    {% endif %}

    <script>
        // Проверяем, выбрал ли уже пользователь устройство
        const savedDevice = localStorage.getItem('deviceType');
        const modal = document.getElementById('device-modal');

        if (!savedDevice) {
            // Если не выбрал - показываем окно
            modal.style.display = 'flex';
        } else if (savedDevice === 'mobile') {
            document.body.classList.add('is-mobile');
        }

        function selectDevice(type) {
            localStorage.setItem('deviceType', type);
            modal.style.display = 'none'; // Скрываем окно
            
            if (type === 'mobile') {
                document.body.classList.add('is-mobile');
            } else {
                document.body.classList.remove('is-mobile');
            }
        }
    </script>
</body>
</html>
