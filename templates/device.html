<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Как устроен дрон</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #000;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            width: 100vw;
            overflow: hidden;
        }
        .img-container {
            position: relative;
            width: 100%;
            height: 100%;
            max-width: calc(100vh * 1440 / 1024);
            max-height: 100vh;
            aspect-ratio: 1440 / 1024;
        }
        .img-container img {
            width: 100%;
            height: 100%;
            object-fit: fill;
            display: block;
        }
        .back-btn {
            position: absolute;
            left: 4%;
            bottom: 1%;
            width: 14%;
            height: 6%;
            cursor: pointer;
            border-radius: 12px;
        }
        .back-btn:hover {
            background: rgba(85, 214, 107, 0.2);
        }
    </style>
</head>
<body>
    <div class="img-container">
        <img src="/static/images/device.jpg" alt="Как устроен дрон">
        <a href="/" class="back-btn"></a>
    </div>
</body>
</html>
