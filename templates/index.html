<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Автономный БПЛА</title>
    <link rel="stylesheet" href="/static/style.css">
    <style>
        /* Стили для кнопок входа (справа сверху, видны только гостям) */
        .auth-buttons {
            position: absolute;
            top: 20px;
            right: 30px;
            z-index: 100;
            display: flex;
            gap: 15px;
            align-items: center;
            font-family: Arial, sans-serif;
        }
        .auth-buttons a {
            font-size: 14px;
            text-decoration: none;
            padding: 8px 16px;
            border-radius: 8px;
            transition: 0.2s;
        }
        .btn-login {
            color: #fff;
            border: 1px solid #55d66b;
        }
        .btn-login:hover { background: rgba(85, 214, 107, 0.2); }
        
        .btn-register {
            color: #000;
            background: #55d66b;
            font-weight: bold;
        }
        .btn-register:hover { background: #45b558; }
        
        /* Стили для плашки внизу по центру */
        .bottom-user-panel {
            position: absolute;
            bottom: 20px;
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 15px;
            z-index: 100;
            pointer-events: none; /* Клики проходят сквозь пустую область */
        }
        
        .bottom-username {
            color: rgba(255,255,255,0.8);
            font-family: Arial, sans-serif;
            font-size: 15px;
            letter-spacing: 1px;
            background: rgba(0,0,0,0.7);
            padding: 8px 20px;
            border-radius: 20px;
            border: 1px solid #333;
        }
        
        .btn-logout-bottom {
            color: #ff5555;
            text-decoration: none;
            font-family: Arial, sans-serif;
            font-size: 14px;
            padding: 8px 18px;
            border-radius: 20px;
            border: 1px solid #ff5555;
            background: rgba(0,0,0,0.7);
            transition: 0.2s;
            pointer-events: auto; /* Возвращаем кликабельность кнопке */
        }
        .btn-logout-bottom:hover {
            background: rgba(255, 85, 85, 0.2);
            color: #fff;
        }
    </style>
</head>
<body class="hero-page">

    <!-- Кнопки аккаунта (справа сверху, показываются ТОЛЬКО если не вошел) -->
    <div class="auth-buttons">
        {% if not session.username %}
            <a href="/login" class="btn-login">Войти</a>
            <a href="/register" class="btn-register">Регистрация</a>
        {% endif %}
    </div>

    <div class="hero-wrapper">
        <img class="hero-image" src="/static/images/hero.jpg" alt="Автономный БПЛА">

        <a href="/device" class="hero-btn hero-btn-1"></a>
        <a href="/tutorial" class="hero-btn hero-btn-2"></a>
        <a href="/search" class="hero-btn hero-btn-3"></a> <!-- Ведет на поиск дрона -->
    </div>

    <!-- Юзернейм и кнопка выхода внизу по центру (показываются ТОЛЬКО если вошел) -->
    {% if session.username %}
    <div class="bottom-user-panel">
        <span class="bottom-username">
            👤 Вы вошли как: <strong style="color: #55d66b;">{{ session.username }}</strong>
        </span>
        <a href="/logout" class="btn-logout-bottom">Выйти</a>
    </div>
    {% endif %}

</body>
</html>
